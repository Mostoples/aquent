<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>AQUAVIV — video frame</title>
<!--
  Template satu FRAME video showcase.
  Dirender berulang oleh mockup/video.cjs via Chrome headless, dengan
  parameter berbeda per frame untuk menghasilkan animasi.

  Parameter query:
    shot=03-dashboard.png   gambar tinggi di mockup/tall/
    pan=0..1                posisi scroll (0 = puncak, 1 = dasar halaman)
    opacity=0..1            untuk fade in/out
    rotY, scale             transform pseudo-3D
    title, sub              caption
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --sw: 412px;          /* lebar layar device (CSS px) */
    --sh: 915px;          /* tinggi layar device        */
    --bezel: 12px;
    --radius: 44px;
    --dev-scale: 1.02;    /* penyesuaian agar device pas di kanvas 1080p */
  }

  html, body { width: 1920px; height: 1080px; overflow: hidden; }

  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 32%, #10353f 0%, #0a1d24 46%, #050f13 100%);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  /* Cahaya dekoratif bernuansa air. */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(760px 460px at 20% 22%, rgba(56,214,214,.17), transparent 68%),
      radial-gradient(700px 440px at 82% 76%, rgba(64,148,240,.16), transparent 68%);
  }

  .stage {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    gap: 96px;
    width: 100%; padding: 0 120px;
  }

  /* ---------- Device ---------- */
  .device-wrap { flex: 0 0 auto; transform: scale(var(--dev-scale)); }

  .device {
    position: relative;
    width: calc(var(--sw) + var(--bezel) * 2);
    height: calc(var(--sh) + var(--bezel) * 2);
    padding: var(--bezel);
    border-radius: var(--radius);
    background: linear-gradient(158deg, #3a4149 0%, #1b1f24 34%, #0d1013 100%);
    box-shadow:
      0 2px 0 rgba(255,255,255,.10) inset,
      0 0 0 1.5px rgba(255,255,255,.07),
      58px 58px 100px -22px rgba(0,0,0,.85),
      24px 24px 46px -14px rgba(0,0,0,.6);
    transform-origin: center center;
  }

  .screen {
    position: relative; width: 100%; height: 100%;
    border-radius: calc(var(--radius) - var(--bezel));
    overflow: hidden;      /* penting: menyembunyikan bagian gambar di luar layar */
    background: #050b0f;
  }

  /* Gambar TINGGI penuh halaman; digeser ke atas untuk efek scroll. */
  .screen img {
    position: absolute; top: 0; left: 0;
    width: 100%;
    height: auto;          /* jaga rasio agar tidak gepeng */
    display: block;
    will-change: transform;
  }

  .glare {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(112deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,.04) 18%, transparent 42%);
  }

  /* Status bar Android */
  .status {
    position: absolute; top: 0; left: 0; right: 0; height: 32px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; z-index: 4;
    color: #fff; font-size: 12.5px; font-weight: 600;
    text-shadow: 0 1px 3px rgba(0,0,0,.7);
    background: linear-gradient(180deg, rgba(0,0,0,.28), transparent);
  }
  .status .right { display: flex; align-items: center; gap: 5px; }

  .punch {
    position: absolute; top: 9px; left: 50%; transform: translateX(-50%);
    width: 12px; height: 12px; border-radius: 50%;
    background: #05070a; z-index: 6;
    box-shadow: 0 0 0 1.5px rgba(255,255,255,.10), 0 0 7px rgba(0,0,0,.85) inset;
  }
  .punch::after {
    content: ""; position: absolute; top: 3px; left: 3.3px;
    width: 3.6px; height: 3.6px; border-radius: 50%;
    background: radial-gradient(circle at 33% 33%, #2d4a63, #0a1016);
  }

  .gesture {
    position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%);
    width: 112px; height: 4.5px; border-radius: 3px;
    background: rgba(255,255,255,.8); z-index: 5;
  }

  .btn-power, .btn-vol {
    position: absolute; right: -2.5px; width: 3px; border-radius: 3px;
    background: linear-gradient(90deg, #0c0f12, #2e343b);
  }
  .btn-power { top: 210px; height: 72px; }
  .btn-vol   { top: 310px; height: 112px; }

  /* Indikator scroll di sisi layar (menegaskan UI sedang di-scroll). */
  .scrollbar {
    position: absolute; top: 40px; right: 5px; bottom: 20px; width: 3px;
    border-radius: 3px; background: rgba(255,255,255,.07); z-index: 5;
  }
  .scrollbar__thumb {
    position: absolute; left: 0; width: 100%;
    border-radius: 3px; background: rgba(56,214,214,.75);
    box-shadow: 0 0 8px rgba(56,214,214,.5);
  }

  /* ---------- Panel teks ---------- */
  .copy { flex: 0 1 560px; color: #eaf3f6; }
  .copy .brand {
    font-size: 15px; font-weight: 800; letter-spacing: .34em;
    color: #38d6d6; text-transform: uppercase; margin-bottom: 20px;
  }
  .copy h1 {
    font-size: 62px; line-height: 1.06; font-weight: 800;
    letter-spacing: -.025em; margin-bottom: 20px;
  }
  .copy p { font-size: 21px; line-height: 1.55; color: #93aab6; }
  .rule {
    width: 84px; height: 4px; border-radius: 3px; margin: 30px 0 0;
    background: linear-gradient(90deg, #38d6d6, #4094f0);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="device-wrap">
    <div class="device" id="device">
      <div class="punch"></div>
      <div class="btn-power"></div>
      <div class="btn-vol"></div>
      <div class="screen">
        <img id="shot" alt="">
        <div class="status">
          <span>09:41</span>
          <span class="right">
            <svg width="17" height="12" viewBox="0 0 17 12" fill="#fff">
              <rect x="0"  y="8.5" width="2.6" height="3.5" rx=".6" opacity=".55"/>
              <rect x="4"  y="6"   width="2.6" height="6"   rx=".6" opacity=".8"/>
              <rect x="8"  y="3"   width="2.6" height="9"   rx=".6"/>
              <rect x="12" y="0"   width="2.6" height="12"  rx=".6"/>
            </svg>
            <svg width="15" height="12" viewBox="0 0 15 12" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round">
              <path d="M1 4.1a9.6 9.6 0 0 1 13 0"/>
              <path d="M3.4 6.9a6.2 6.2 0 0 1 8.2 0"/>
              <circle cx="7.5" cy="10.1" r="1.05" fill="#fff" stroke="none"/>
            </svg>
            <svg width="24" height="12" viewBox="0 0 24 12" fill="none">
              <rect x=".7" y=".7" width="20" height="10.6" rx="2.6" stroke="#fff" stroke-opacity=".85" stroke-width="1.3"/>
              <rect x="2.4" y="2.4" width="14.6" height="7.2" rx="1.5" fill="#fff"/>
              <path d="M22.4 4.1v3.8c1-.4 1.5-1 1.5-1.9s-.5-1.5-1.5-1.9Z" fill="#fff" fill-opacity=".85"/>
            </svg>
          </span>
        </div>
        <div class="scrollbar"><div class="scrollbar__thumb" id="thumb"></div></div>
        <div class="glare"></div>
        <div class="gesture"></div>
      </div>
    </div>
  </div>

  <div class="copy">
    <div class="brand">AQUAVIV</div>
    <h1 id="title">Dashboard</h1>
    <p id="sub">Smart Shower Water Quality Monitor</p>
    <div class="rule"></div>
  </div>
</div>

<script>
  var q = new URLSearchParams(location.search);
  var shot = q.get('shot') || '03-dashboard.png';
  var pan = parseFloat(q.get('pan') || '0');
  var opacity = q.get('opacity');
  var rotY = q.get('rotY');
  var scale = q.get('scale');

  if (q.get('title')) document.getElementById('title').textContent = q.get('title');
  if (q.get('sub')) document.getElementById('sub').textContent = q.get('sub');

  var img = document.getElementById('shot');
  var device = document.getElementById('device');
  var thumb = document.getElementById('thumb');
  var stage = document.querySelector('.stage');

  // Transform pseudo-3D + fade.
  device.style.transform =
    'perspective(2200px) rotateY(' + (rotY || -16) + 'deg) rotateX(4deg) scale(' + (scale || 1) + ')';
  if (opacity !== null) stage.style.opacity = opacity;

  // Tinggi layar device dalam CSS px (harus cocok dengan --sh).
  var SCREEN_H = 915;

  // Lebar layar device dalam CSS px (harus cocok dengan --sw).
  var SCREEN_W = 412;

  /**
   * Hitung offset scroll:
   *   tinggiTampil = tinggiNatural * (lebarLayar / lebarNatural)
   *   maxScroll    = tinggiTampil - tinggiLayar
   *   translateY   = -pan * maxScroll
   *
   * PENTING: tinggi dihitung dari RASIO NATURAL gambar, bukan
   * getBoundingClientRect(). Rect mengukur ukuran SETELAH transform CSS
   * (device di-scale dan dirotasi), sehingga menghasilkan tinggi yang
   * melebihi ukuran layar sebenarnya — dulu ini membuat halaman satu-layar
   * ikut bergeser ~20px padahal seharusnya diam.
   */
  function applyScroll() {
    var natW = img.naturalWidth;
    var natH = img.naturalHeight;
    if (!natW || !natH) return false;

    var shownH = natH * (SCREEN_W / natW);
    var maxScroll = Math.max(0, shownH - SCREEN_H);
    img.style.transform = 'translateY(' + (-pan * maxScroll).toFixed(2) + 'px)';

    // Thumb scrollbar: proporsi layar terhadap total, posisi mengikuti pan.
    var track = SCREEN_H - 60;
    var ratio = Math.min(1, SCREEN_H / shownH);
    var th = Math.max(28, track * ratio);
    thumb.style.height = th.toFixed(1) + 'px';
    thumb.style.top = ((track - th) * pan).toFixed(1) + 'px';
    // Sembunyikan scrollbar bila halaman tidak dapat di-scroll.
    thumb.parentNode.style.opacity = maxScroll > 4 ? '1' : '0';

    // Mode debug: laporkan hasil perhitungan agar dapat diverifikasi.
    if (q.get('debug') === '1') {
      document.title = 'PAN::' + JSON.stringify({
        shownH: +shownH.toFixed(2),
        screenH: SCREEN_H,
        maxScroll: +maxScroll.toFixed(2),
        pan: pan,
        translateY: +(-pan * maxScroll).toFixed(2),
        natW: img.naturalWidth,
        natH: img.naturalHeight
      });
    }
    return true;
  }

  img.onload = function () {
    if (!applyScroll()) setTimeout(applyScroll, 40);
  };
  img.src = 'tall/' + shot;
  // Jaring pengaman bila onload sudah lewat (gambar ter-cache).
  setTimeout(applyScroll, 120);
  setTimeout(applyScroll, 320);
</script>
</body>
</html>
